<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Evelyn Olivera SAS</title>

		<!-- IMÁGENES CON PRIORIDAD PARA LA CARGA INICIAL -->
		<link rel="preload" href="img/ES.webp" as="image">
		<link rel="preload" href="img/EN.webp" as="image">
		<link rel="preload" href="img/portrait.svg" as="image">
		<link rel="preload" href="img/background.svg" as="image">

		<link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
		<link rel="manifest" href="img/favicon/site.webmanifest">

		<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

		<link rel="stylesheet" href="./styles/main.css">
	</head>
	<body class="eol-body loading">
		<div class="wrapper">
			<img id="portrait"
				 data-i18n-scope="general"
				 data-i18n-alt="portrait"
				 src="img/portrait.svg">

			<!-- ESTE ELEMENTO MARCA SI HAY UNA SECCIÓN ACTIVA O NO (PUEDE SER DE IDIOMA TAMBIÉN) -->
			<div class="sections-wrapper"> 
				<section class="tools" data-i18n-scope="general">
					<img id="go_back" class="pixel-animation" src="img/go_back.webp" data-i18n="buttons.back" onClick="goBack()" role="button">
					
					<span>
						<img id="music_off" class="pixel-animation" src="img/sound_off.webp" data-i18n="buttons.music.off" onClick="toggleMusic(false)" role="button">
						<img id="music_on" class="pixel-animation" src="img/sound_on.webp" data-i18n="buttons.music.on" onClick="toggleMusic(true)" role="button">
						
						<img id="language_switcher" class="pixel-animation" src="img/lang_switch.webp" data-i18n="buttons.lang" onClick="showLanguage()" role="button">
					</span>
				</section>
				
				<div id="language" data-i18n-scope="general">
					<img id="language--ES" class="pixel-animation" src="img/ES.webp" data-i18n="buttons.languages.ES" onClick="setLanguage('ES')" />
				
					<img id="language--EN" class="pixel-animation" src="img/EN.webp" data-i18n="buttons.languages.EN" onClick="setLanguage('EN')" />
				</div>

				<div class="container">
					<h1 class="container_welcome" data-i18n-scope="general" data-i18n="welcome"></h1>

					<section id="actions" data-i18n-scope="general"
							 class="container_section-actions">
						<button id="actions_objectives" data-i18n="buttons.objectives" onClick="openSection('objectives')"></button>

						<button id="actions_collection" data-i18n="buttons.collection" onClick="openSection('collection')"></button>

						<button id="actions_contact" data-i18n="buttons.contact" onClick="openSection('contact')"></button>
					</section>

					<section id="objectives" class="container_section container_section--objectives" data-i18n-scope="objectives">
						 <ul class="section_missions" data-i18n-scope="missions">
							<li class="section_item" id="section_item--dev">
								<img src="img/objectives/mission_dev.webp" data-i18n="dev.alt" />
								<h4 data-i18n="dev.cta"></h4>
								<h3 data-i18n="dev.title"></h3>
								
								<div class="section_mission">
									<p data-i18n="dev.description"></p>
								
									<button data-i18n="button" disabled></button>
								</div>
							</li>
							<li class="section_item" id="section_item--ui">
								<img src="img/objectives/mission_ui.webp" data-i18n="ui.alt" />
								<h4 data-i18n="ui.cta"></h4>
								<h3 data-i18n="ui.title"></h3>
								
								<div class="section_mission">
									<p data-i18n="ui.description"></p>
									
									<button data-i18n="button" disabled></button>
								</div>
							</li>
							<li class="section_item" id="section_item--support">
								<img src="img/objectives/mission_support.webp" data-i18n="support.alt" />
								<h4 data-i18n="support.cta"></h4>
								<h3 data-i18n="support.title"></h3>
								
								<div class="section_mission">
									<p data-i18n="support.description"></p>
									
									<button data-i18n="button" disabled></button>
								</div>
							</li>
						</ul>
						<ol class="section_levels" data-i18n-scope="levels">
							<li class="section_item" id="section_item--first">							
								<img src="img/objectives/level_swords.webp" data-i18n="first.alt" />

								<h3 data-i18n="first.cta"></h3>
								
								<p data-i18n="first.description"></p>
							</li>
							<li class="section_item" id="section_item--second">
								<img src="img/objectives/level_arrow.webp" data-i18n="second.alt" />

								<h3 data-i18n="second.cta"></h3>
								
								<p data-i18n="second.description"></p>
							</li>
							<li class="section_item" id="section_item--third">
								<img src="img/objectives/level_wand.webp" data-i18n="third.alt" />

								<h3 data-i18n="third.cta"></h3>
								
								<p data-i18n="third.description"></p>
							</li>
						</ol>
					</section>

					<section id="collection" class="container_section container_section-collection" data-i18n-scope="collection">
					

					</section>

					<section id="contact" class="container_section container_section-form" data-i18n-scope="contact">
						<form class="form"
							  name="contact"
							  onsubmit="onSubmit(event, this)">
							
							<div class="form_input--group" data-i18n-scope="name">
								<img src="img/icons/form_name.png" id="form_icon--name" class="form_control--icon" data-i18n-alt="icon" />
								<input class="form_control" 
									   name="name" 
									   autocomplete="on"
									   type="text"
									   data-i18n-placeholder="placeholder"
									   required />
							</div>
							
							<div class="form_input--group" data-i18n-scope="email">
								<img src="img/icons/form_email.png" id="form_icon--email" class="form_control--icon" data-i18n-alt="icon" />
								<input class="form_control" 
									   name="email" 
									   autocomplete="on"
									   type="email"
									   data-i18n-placeholder="placeholder"
									   required />
							</div>

							<div class="form_input--group" data-i18n-scope="phone">
								<img src="img/icons/form_phone.png" id="form_icon--phone" class="form_control--icon" data-i18n-alt="icon" />
								<input class="form_control" 
									   name="phone" 
									   autocomplete="on"
									   data-i18n-placeholder="placeholder"
									   type="phone" />
							</div>	
							
							<textarea class="form_control form_control-textarea" 
									  name="message"
									  autocomplete="off"
									  data-i18n="textarea"
									  required>
							</textarea>
							
							<div class="form_button">
								<button type="submit"
										data-i18n="buttons.send"
										class="form_button__submit"></button>
								
								<button type="button"
										data-i18n="buttons.wpp"
										class="form_button__wpp"
										onclick="window.open('https://wa.me/59897688678')" target="_blank"></button>
							</div>
						</form>
					</section>

				</div>
			</div>
		</div>

		<script type="text/javascript"
				src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
		</script>
		<script type="text/javascript">
		   (function(){
			  emailjs.init({
				publicKey: "s2f5vdtJYhdAohf2P",
			  });
		   })();
		</script>		
		
		<audio id="bg-music" src="assets/sound.ogg" preload="auto" autoplay loop></audio>

		<script src="js/constants.js"></script>
		<script src="js/translator.js"></script>
		<script src="js/scripts.js"></script>
	</body>
</html>
